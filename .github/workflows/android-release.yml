name: Android Release — Play closed testing

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track (alpha = Closed testing - Alpha)'
        required: true
        default: alpha
  # Every push/merge to main publishes a new build to closed testing.
  push:
    branches: [main]

# Serialise releases: two quick merges must not race on the same Play track.
concurrency:
  group: play-release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.29.0'
  JAVA_VERSION: '21'
  PACKAGE_NAME: 'com.habiboys.lanjo'

jobs:
  release:
    name: Build & publish AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Resolve version
        id: version
        run: |
          VERSION_LINE="$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          BASE_CODE="0"
          case "$VERSION_LINE" in
            *+*) BASE_CODE="${VERSION_LINE##*+}" ;;
          esac
          # Play requires a versionCode higher than every previous upload.
          # derive it from the pubspec build number + the monotonic run number.
          BUILD_NUMBER=$((BASE_CODE + GITHUB_RUN_NUMBER))
          {
            echo "name=$VERSION_NAME"
            echo "code=$BUILD_NUMBER"
          } >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME ($BUILD_NUMBER)"

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build app bundle
        run: |
          flutter build appbundle --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: lanjo-${{ steps.version.outputs.code }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # "alpha" is the Closed testing - Alpha track in Play Console; Play's "beta"
      # track is open testing.
      - name: Publish to Play closed testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: ${{ github.event.inputs.track || 'alpha' }}
          status: completed
