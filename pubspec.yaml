name: lanjo
description: "Arus — Personal Finance & Smart Money Assistant (Local-First, Offline-First)"
publish_to: 'none'
version: 1.3.0+7000

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.32
  path_provider: ^2.1.5
  path: ^1.9.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  file_picker: ^9.2.1
  share_plus: ^10.1.4
  intl: ">=0.19.0 <0.21.0"
  uuid: ^4.5.1
  crypto: ^3.0.6
  encrypt: ^5.0.3
  archive: ^3.6.1
  csv: ^6.0.0
  excel: ^4.0.6
  pdf: ^3.11.3
  lucide_icons_flutter: ^4.0.3
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.26.0
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
